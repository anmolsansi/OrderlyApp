services:
  - type: web
    name: orderlyapp-api
    env: python
    rootDir: backend
    buildCommand: pip install -e .
    # Render documents preDeployCommand for paid web services. Do not upgrade or
    # activate a paid plan solely from this blueprint without explicit approval.
    preDeployCommand: python scripts/migrate.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ORDERLY_DATA_MODE
        value: api
      - key: ORDERLY_ENVIRONMENT
        value: production
      - key: ORDERLY_SESSION_SECRET
        generateValue: true
      - key: ORDERLY_ALLOWED_ORIGINS
        sync: false
      - key: ORDERLY_CORS_ORIGINS
        sync: false
      - key: ORDERLY_CHECKOUT_RATE_WINDOW_SECONDS
        value: "60"
      - key: ORDERLY_CHECKOUT_RATE_LIMIT_PER_GUEST
        value: "10"
      - key: ORDERLY_CHECKOUT_RATE_LIMIT_AGGREGATE
        value: "120"

  # Daily retention is scheduled by .github/workflows/guest-cleanup.yml.
  - type: web
    name: orderlyapp-web
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: ORDERLY_API_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_VOICE_MODE
        value: browser
