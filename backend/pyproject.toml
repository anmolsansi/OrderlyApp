[project]
name = "orderlyapp-backend"
version = "0.2.0"
description = "FastAPI backend for OrderlyApp"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0"
]

[tool.setuptools]
packages = ["app"]

[tool.uv]
package = false
