name: ST-01 Guide Sync

on:
  push:
    branches:
      - chore/st-01-baseline-contracts

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified ST-01 evidence
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path("development.md")
          marker = "## ST-01 implementation evidence — 2026-10-04"
          text = path.read_text(encoding="utf-8")
          encoded = ""
          if marker not in text:
              block = base64.b64decode(encoded).decode("utf-8")
              path.write_text(text.rstrip() + block + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/st01-sync-guide.yml
          git add development.md
          git commit -m "docs(stabilization): record ST-01 evidence [46-47/50] (#20)"
          git push origin HEAD:${GITHUB_REF_NAME}
