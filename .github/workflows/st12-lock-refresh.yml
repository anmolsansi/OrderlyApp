name: ST-12 Lock Refresh

on:
  push:
    branches:
      - chore/st-12-release-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): refresh npm lock for eslint [10/50] (#43)"
          git push origin HEAD:chore/st-12-release-ci
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: st12-package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
