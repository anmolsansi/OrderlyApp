name: ST-12 Lock Refresh

on:
  push:
    branches:
      - chore/st-12-release-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: st12-package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
