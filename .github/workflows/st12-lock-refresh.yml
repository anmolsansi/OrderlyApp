name: ST-12 Lock Refresh

on:
  push:
    branches:
      - chore/st-12-release-ci

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.20.0
      - name: Refresh and commit package lock
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): refresh npm lock for eslint 10 [12/50] (#43)"
          git push origin HEAD:chore/st-12-release-ci
