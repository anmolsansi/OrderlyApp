name: Stabilization CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.versions.outputs.node_version }}
      npm_version: ${{ steps.versions.outputs.npm_version }}
      python_version: ${{ steps.versions.outputs.python_version }}
      pip_audit_version: ${{ steps.versions.outputs.pip_audit_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Resolve backend candidate dependencies and pinned audit tooling
        run: |
          python -m pip install ./backend
          python -m pip install -r backend/requirements-test.lock
          python -m pip uninstall -y orderlyapp-backend
      - name: Record dependency runtime versions
        id: versions
        shell: bash
        run: |
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "npm_version=$(npm --version)" >> "$GITHUB_OUTPUT"
          echo "python_version=$(python --version 2>&1)" >> "$GITHUB_OUTPUT"
          echo "pip_audit_version=$(python -m pip_audit --version)" >> "$GITHUB_OUTPUT"
          {
            echo "## Dependency security"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
            echo "- Python: \`$(python --version 2>&1)\`"
            echo "- pip-audit: \`$(python -m pip_audit --version)\`"
            echo "- npm audit threshold: high"
            echo "- Python audit: candidate-resolved third-party environment, strict collection"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Scan npm dependencies at high severity threshold
        id: npm_audit
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm audit --audit-level=high --json | tee artifacts/npm-audit.json
      - name: Scan installed Python dependency environment
        id: pip_audit
        continue-on-error: true
        run: python -m pip_audit --local --strict --progress-spinner=off --format=json --output artifacts/pip-audit.json
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-dependency-audit-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Enforce dependency security gates
        if: always()
        shell: bash
        env:
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
          PIP_AUDIT: ${{ steps.pip_audit.outcome }}
        run: |
          echo "npm audit=${NPM_AUDIT}"
          echo "pip-audit=${PIP_AUDIT}"
          if [[ "$NPM_AUDIT" != "success" || "$PIP_AUDIT" != "success" ]]; then
            echo "A dependency audit failed. Inspect the uploaded current-scan evidence."
            exit 1
          fi

  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Run genuine ESLint
        run: npm run lint
      - name: Validate contract fixtures in TypeScript
        run: npm run test:contracts
      - name: Run frontend unit suite
        run: npm run test
      - name: Typecheck frontend separately
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend and recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orderlyapp_test
          POSTGRES_USER: orderly
          POSTGRES_PASSWORD: orderly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderly -d orderlyapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_test
      ORDERLY_TEST_DATABASE_URL: postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Install backend runtime and pinned test dependencies
        run: |
          python -m pip install -e ./backend
          python -m pip install -r backend/requirements-test.lock
      - name: Apply database migrations
        run: python backend/scripts/migrate.py
      - name: Run BACKEND suite
        run: python -m pytest backend/tests -q
      - name: Rehearse transaction-consistent receipt backup and restore
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from uuid import uuid4

          import psycopg

          fixture = json.loads(Path("tests/fixtures/contracts/c5.json").read_text(encoding="utf-8"))
          receipt = fixture["positive"]["receipt"]
          receipt["id"] = str(uuid4())
          owner_id = f"guest-st11-backup-{uuid4()}"

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              conn.execute(
                  """
                  INSERT INTO guest_sessions (id, token_hash, expires_at)
                  VALUES (%s, %s, now() + interval '1 day')
                  """,
                  (owner_id, uuid4().hex),
              )
              conn.execute(
                  """
                  INSERT INTO guest_orders (id, owner_id, snapshot, created_at)
                  VALUES (%s, %s, %s::jsonb, %s)
                  """,
                  (receipt["id"], owner_id, json.dumps(receipt), receipt["created_at"]),
              )

          Path("artifacts/backup-proof.json").write_text(
              json.dumps({"receipt_id": receipt["id"], "total_cents": 1192}),
              encoding="utf-8",
          )
          print(f"Prepared synthetic receipt {receipt['id']} for backup proof")
          PY
          docker run --rm --network host \
            -e PGPASSWORD=orderly \
            -v "${GITHUB_WORKSPACE}/artifacts:/backup" \
            postgres:16-alpine \
            pg_dump -h 127.0.0.1 -U orderly -d orderlyapp_test \
              --format=custom --no-owner --no-acl --file=/backup/orderlyapp_test.dump
          docker run --rm --network host \
            -e PGPASSWORD=orderly \
            postgres:16-alpine \
            psql -h 127.0.0.1 -U orderly -d postgres -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE IF EXISTS orderlyapp_restore WITH (FORCE);" \
              -c "CREATE DATABASE orderlyapp_restore;"
          docker run --rm --network host \
            -e PGPASSWORD=orderly \
            -v "${GITHUB_WORKSPACE}/artifacts:/backup" \
            postgres:16-alpine \
            pg_restore -h 127.0.0.1 -U orderly -d orderlyapp_restore \
              --single-transaction --exit-on-error --no-owner --no-acl \
              /backup/orderlyapp_test.dump
          python - <<'PY'
          import json
          from pathlib import Path

          import psycopg

          proof = json.loads(Path("artifacts/backup-proof.json").read_text(encoding="utf-8"))
          with psycopg.connect(
              "postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_restore"
          ) as conn:
              row = conn.execute(
                  "SELECT snapshot FROM guest_orders WHERE id = %s",
                  (proof["receipt_id"],),
              ).fetchone()
              assert row is not None
              snapshot = row[0]
              assert snapshot["id"] == proof["receipt_id"]
              assert snapshot["totals"]["total_cents"] == proof["total_cents"]
              migration_count = conn.execute("SELECT count(*) FROM schema_migrations").fetchone()[0]
              assert migration_count > 0
          print(
              f"Backup/restore verified receipt={proof['receipt_id']} "
              f"total_cents={proof['total_cents']} migrations={migration_count}"
          )
          PY
          rm -f artifacts/orderlyapp_test.dump artifacts/backup-proof.json
          docker run --rm --network host \
            -e PGPASSWORD=orderly \
            postgres:16-alpine \
            psql -h 127.0.0.1 -U orderly -d postgres -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE IF EXISTS orderlyapp_restore WITH (FORCE);"

  browser-runtime:
    name: Chromium runtime
    runs-on: ubuntu-latest
    outputs:
      chromium_version: ${{ steps.chromium.outputs.chromium_version }}
      playwright_version: ${{ steps.chromium.outputs.playwright_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Provision Chromium
        run: npm run test:e2e:install
      - name: Launch Chromium and record runtime
        id: chromium
        shell: bash
        run: |
          version=$(node --input-type=module -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch({ headless: true }); console.log(await browser.version()); await browser.close();")
          playwright_version=$(npx playwright --version)
          echo "Chromium launch OK: ${version}"
          echo "Playwright: ${playwright_version}"
          echo "chromium_version=${version}" >> "$GITHUB_OUTPUT"
          echo "playwright_version=${playwright_version}" >> "$GITHUB_OUTPUT"

  e2e:
    name: API product E2E
    needs: [dependency-security, web, backend, browser-runtime]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orderlyapp_e2e
          POSTGRES_USER: orderly
          POSTGRES_PASSWORD: orderly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderly -d orderlyapp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_e2e
      REDIS_URL: redis://127.0.0.1:6379
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      ORDERLY_API_ORIGIN: http://127.0.0.1:8000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3200
      NEXT_PUBLIC_VOICE_MODE: mock
      NEXT_PUBLIC_CHECKOUT_MODE: mock
      NEXT_PUBLIC_AUTH_PROVIDER: none
      NEXT_PUBLIC_ORDERLY_DATA_MODE: api
      ORDERLY_DATA_MODE: api
      ORDERLY_ENVIRONMENT: test
      ORDERLY_SOURCE_SHA: ${{ github.sha }}
      ORDERLY_SESSION_SECRET: ci-st02-session-secret-with-more-than-32-bytes
      ORDERLY_ALLOWED_ORIGINS: http://127.0.0.1:3200
      ORDERLY_CORS_ORIGINS: http://127.0.0.1:3200
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3200
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Install backend runtime
        run: python -m pip install -e ./backend
      - name: Prepare API database with explicit test fixtures
        run: |
          python backend/scripts/migrate.py
          ORDERLY_ALLOW_FIXTURE_SEED=1 python backend/scripts/seed_postgres.py
      - name: Start API and prove exact C8 readiness
        shell: bash
        run: |
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/orderly-api.log 2>&1 &)
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /tmp/orderly-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/orderly-api.log
            exit 1
          fi
          cat /tmp/orderly-health.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads(Path('/tmp/orderly-health.json').read_text(encoding='utf-8'))
          assert health['schema_version'] == 1
          assert health['ready'] is True
          assert health['mode'] == 'api'
          assert health['source_sha'] == os.environ['GITHUB_SHA']
          assert health['dependencies']['postgres'] == 'ok'
          assert health['dependencies']['schema'] == 'ok'
          print(f"Verified readiness for candidate {health['source_sha']}")
          PY
      - name: Provision Chromium
        run: npm run test:e2e:install
      - name: Require non-empty API-mode product suite
        shell: bash
        run: |
          output=$(npx playwright test --list --grep-invert 'local_demo')
          printf '%s\n' "$output"
          count=$(printf '%s\n' "$output" | grep -c '^  \[chromium\]' || true)
          if [[ "$count" -lt 1 ]]; then
            echo "No mandatory API-mode product tests were discovered"
            exit 1
          fi
          echo "Discovered ${count} mandatory API-mode tests"
      - name: Run mandatory API product E2E suite
        run: npx playwright test --grep-invert 'local_demo'
      - name: Collect E2E runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cp /tmp/orderly-api.log artifacts/orderly-api.log 2>/dev/null || true
          cp /tmp/orderly-health.json artifacts/orderly-health.json 2>/dev/null || true
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-api-e2e-${{ github.run_id }}
          path: |
            artifacts
            test-results
          if-no-files-found: ignore
          retention-days: 14

  local-demo:
    name: Local fixture preview E2E
    needs: [dependency-security, web, browser-runtime]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ORDERLY_DATA_MODE: local_demo
      ORDERLY_DATA_MODE: local_demo
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3200
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Provision Chromium
        run: npm run test:e2e:install
      - name: Require local-demo safety cases
        shell: bash
        run: |
          output=$(npx playwright test --list --grep 'local_demo')
          printf '%s\n' "$output"
          count=$(printf '%s\n' "$output" | grep -c '^  \[chromium\]' || true)
          if [[ "$count" -lt 2 ]]; then
            echo "Expected at least two mandatory local_demo safety tests, found ${count}"
            exit 1
          fi
          echo "Discovered ${count} local_demo safety tests"
      - name: Run local-demo safety suite
        run: npx playwright test --grep 'local_demo'
      - name: Upload local-demo failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-local-demo-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  release-evidence:
    name: Release candidate evidence
    if: always()
    needs: [dependency-security, web, backend, browser-runtime, e2e, local-demo]
    runs-on: ubuntu-latest
    steps:
      - name: Record exact candidate evidence
        shell: bash
        run: |
          {
            echo "## ST-12 release candidate evidence"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Node: \`${{ needs.dependency-security.outputs.node_version }}\`"
            echo "- npm: \`${{ needs.dependency-security.outputs.npm_version }}\`"
            echo "- Python: \`${{ needs.dependency-security.outputs.python_version }}\`"
            echo "- pip-audit: \`${{ needs.dependency-security.outputs.pip_audit_version }}\`"
            echo "- PostgreSQL service image: \`postgres:16-alpine\`"
            echo "- Playwright: \`${{ needs.browser-runtime.outputs.playwright_version }}\`"
            echo "- Chromium: \`${{ needs.browser-runtime.outputs.chromium_version }}\`"
            echo "- Dependency security: ${{ needs.dependency-security.result }}"
            echo "- Genuine lint / units / typecheck / build: ${{ needs.web.result }}"
            echo "- Backend / Postgres / recovery: ${{ needs.backend.result }}"
            echo "- Chromium launch: ${{ needs.browser-runtime.result }}"
            echo "- API product E2E: ${{ needs.e2e.result }}"
            echo "- Local fixture preview E2E: ${{ needs.local-demo.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed unless every release gate succeeded
        shell: bash
        env:
          DEPENDENCY_SECURITY: ${{ needs.dependency-security.result }}
          WEB: ${{ needs.web.result }}
          BACKEND: ${{ needs.backend.result }}
          BROWSER_RUNTIME: ${{ needs.browser-runtime.result }}
          E2E: ${{ needs.e2e.result }}
          LOCAL_DEMO: ${{ needs.local-demo.result }}
        run: |
          failed=0
          for name in DEPENDENCY_SECURITY WEB BACKEND BROWSER_RUNTIME E2E LOCAL_DEMO; do
            value="${!name}"
            echo "${name}=${value}"
            if [[ "$value" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" != "0" ]]; then
            echo "Release evidence is incomplete: every required job must succeed; failed, cancelled, and skipped are not passes."
            exit 1
          fi
