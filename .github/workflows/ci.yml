name: ST-01 Baseline

on:
  push:
    branches:
      - chore/st-01-baseline-contracts
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Validate contract fixtures in TypeScript
        run: npm run test:contracts
      - name: Run frontend unit suite
        run: npm run test
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
