name: Stabilization CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Validate contract fixtures in TypeScript
        run: npm run test:contracts
      - name: Run frontend unit suite
        run: npm run test
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orderlyapp_test
          POSTGRES_USER: orderly
          POSTGRES_PASSWORD: orderly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderly -d orderlyapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_test
      ORDERLY_TEST_DATABASE_URL: postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Install backend runtime and pinned test dependencies
        run: |
          python -m pip install -e ./backend
          python -m pip install -r backend/requirements-test.lock
      - name: Apply database migrations
        run: python backend/scripts/migrate.py
      - name: Run BACKEND suite
        run: python -m pytest backend/tests -q

  browser-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Provision Chromium
        run: npm run test:e2e:install
      - name: Launch and close Chromium
        run: >-
          node --input-type=module -e "import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          console.log('Chromium launch OK:', await browser.version());
          await browser.close();"

  e2e:
    needs: browser-runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orderlyapp_e2e
          POSTGRES_USER: orderly
          POSTGRES_PASSWORD: orderly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderly -d orderlyapp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_e2e
      REDIS_URL: redis://127.0.0.1:6379
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      ORDERLY_API_ORIGIN: http://127.0.0.1:8000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3200
      NEXT_PUBLIC_VOICE_MODE: mock
      NEXT_PUBLIC_CHECKOUT_MODE: mock
      NEXT_PUBLIC_AUTH_PROVIDER: none
      ORDERLY_DATA_MODE: api
      ORDERLY_ENVIRONMENT: test
      ORDERLY_SOURCE_SHA: ${{ github.sha }}
      ORDERLY_SESSION_SECRET: ci-st02-session-secret-with-more-than-32-bytes
      ORDERLY_ALLOWED_ORIGINS: http://127.0.0.1:3200
      ORDERLY_CORS_ORIGINS: http://127.0.0.1:3200
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3200
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Install backend runtime
        run: python -m pip install -e ./backend
      - name: Prepare API database with explicit test fixtures
        run: |
          python backend/scripts/migrate.py
          ORDERLY_ALLOW_FIXTURE_SEED=1 python backend/scripts/seed_postgres.py
      - name: Start API and prove C8 readiness
        shell: bash
        run: |
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/orderly-api.log 2>&1 &)
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /tmp/orderly-health.json; then
              cat /tmp/orderly-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/orderly-api.log
          exit 1
      - name: Provision Chromium
        run: npm run test:e2e:install
      - name: Run product E2E suite
        run: npm run test:e2e
      - name: Collect E2E runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cp /tmp/orderly-api.log artifacts/orderly-api.log 2>/dev/null || true
          cp /tmp/orderly-health.json artifacts/orderly-health.json 2>/dev/null || true
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-e2e-${{ github.run_id }}
          path: |
            artifacts
            test-results
          if-no-files-found: ignore
          retention-days: 14

  baseline-evidence:
    if: always()
    needs: [web, backend, browser-runtime, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Record source and job results
        shell: bash
        run: |
          {
            echo "## Stabilization CI evidence"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Node baseline: 22"
            echo "- npm resolver: 11.20.0"
            echo "- Python baseline: 3.12"
            echo "- WEB: ${{ needs.web.result }}"
            echo "- BACKEND: ${{ needs.backend.result }}"
            echo "- Chromium launch: ${{ needs.browser-runtime.result }}"
            echo "- Product E2E: ${{ needs.e2e.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
