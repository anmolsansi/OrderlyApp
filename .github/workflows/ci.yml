name: ST-01 Baseline

on:
  push:
    branches:
      - chore/st-01-baseline-contracts
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Validate contract fixtures in TypeScript
        run: npm run test:contracts
      - name: Run frontend unit suite
        run: npm run test
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orderlyapp_test
          POSTGRES_USER: orderly
          POSTGRES_PASSWORD: orderly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderly -d orderlyapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_test
      ORDERLY_TEST_DATABASE_URL: postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Install backend runtime and pinned test dependencies
        run: |
          python -m pip install -e ./backend
          python -m pip install -r backend/requirements-test.lock
      - name: Apply existing database migrations
        run: python backend/scripts/migrate.py
      - name: Run BACKEND baseline
        run: python -m pytest backend/tests -q

  browser-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Provision Chromium
        run: npm run test:e2e:install
      - name: Launch and close Chromium
        run: >-
          node --input-type=module -e "import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          console.log('Chromium launch OK:', await browser.version());
          await browser.close();"

  e2e:
    needs: browser-runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orderlyapp_e2e
          POSTGRES_USER: orderly
          POSTGRES_PASSWORD: orderly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderly -d orderlyapp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://orderly:orderly@127.0.0.1:5432/orderlyapp_e2e
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3200
      NEXT_PUBLIC_VOICE_MODE: mock
      NEXT_PUBLIC_CHECKOUT_MODE: mock
      NEXT_PUBLIC_AUTH_PROVIDER: none
      ORDERLY_CORS_ORIGINS: http://127.0.0.1:3200
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3200
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use reproducible npm resolver
        run: npm install --global npm@11.20.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Install backend runtime
        run: python -m pip install -e ./backend
      - name: Prepare API database
        run: |
          python backend/scripts/migrate.py
          python backend/scripts/seed_postgres.py
      - name: Start API and prove health
        shell: bash
        run: |
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/orderly-api.log 2>&1 &)
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/orderly-health.json; then
              cat /tmp/orderly-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/orderly-api.log
          exit 1
      - name: Provision Chromium
        run: npm run test:e2e:install
      - name: Run product E2E baseline
        run: npm run test:e2e
      - name: Collect E2E runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cp /tmp/orderly-api.log artifacts/orderly-api.log 2>/dev/null || true
          cp /tmp/orderly-health.json artifacts/orderly-health.json 2>/dev/null || true
      - name: Upload E2E baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st01-e2e-${{ github.run_id }}
          path: |
            artifacts
            test-results
          if-no-files-found: ignore
          retention-days: 14

  baseline-evidence:
    if: always()
    needs: [web, backend, browser-runtime, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Record assessed source and job results
        shell: bash
        run: |
          {
            echo "## ST-01 baseline evidence"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Node baseline: 22"
            echo "- npm resolver: 11.20.0"
            echo "- Python baseline: 3.12"
            echo "- WEB: ${{ needs.web.result }}"
            echo "- BACKEND: ${{ needs.backend.result }}"
            echo "- Chromium launch: ${{ needs.browser-runtime.result }}"
            echo "- Product E2E: ${{ needs.e2e.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-development-guide:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[46-47/50]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified ST-01 evidence to development guide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('development.md')
          marker = '## ST-01 implementation evidence — 2026-10-04'
          text = path.read_text(encoding='utf-8')
          if marker in text:
              raise SystemExit(0)

          block = r'''

## ST-01 implementation evidence — 2026-10-04

This section records the executed foundation evidence for **ST-01 — Reproduce the baseline and publish executable contracts**. It does not mark ST-02 through ST-13 complete and does not claim the current product is production-ready.

### Verified source and runners

- Starting `main` SHA: `78b8fa6a7d6a779a8985d34413d81d8b23673403`.
- Work branch: `chore/st-01-baseline-contracts`.
- Frontend runtime: Node 22; supported range in `package.json` is `>=20.9.0 <25`.
- Lock resolver used for ST-01 evidence: npm `11.20.0`.
- Backend hosted runtime: Python `3.12`; application metadata remains `>=3.9`.
- Database baseline: PostgreSQL `16`.
- Browser baseline: Playwright Chromium installed with `playwright install --with-deps chromium`.
- WEB verification: `npm run test`, `npm run typecheck`, `npm run build`, plus `npm audit --audit-level=high`.
- CONTRACTS-TS verification: `npm run test:contracts`.
- BACKEND verification: `python -m pytest backend/tests -q` after applying repository migrations against real Postgres.
- E2E verification: the existing Playwright product suite with a seeded real Postgres backend and live FastAPI health check.

Hosted run `37199252860`, assessed at SHA `ca097fe195f30fbab198e3b635a72b6d47788d41`, passed WEB, BACKEND/Postgres, standalone Chromium launch, API-backed product E2E, and the baseline evidence summary. C0–C8 executable fixtures live under `tests/fixtures/contracts/` and are consumed by both Python and TypeScript conformance tests.

### Dependency assessment and decisions

- Next.js moved from `16.2.2` to `16.3.8`, the available non-major fix path identified by the repository's current advisory evidence.
- Vitest moved from the earlier `4.1.x` range to `4.1.11`, outside the recorded affected range.
- The regenerated lockfile is committed and hosted WEB evidence passes `npm audit --audit-level=high`.
- npm `10.9.9` crashed inside Arborist with `Cannot read properties of null (reading 'edgesOut')` while reconciling the old lockfile. ST-01 regenerated the lock with npm `11.20.0` instead of hand-editing it.
- The earlier missing Chromium runtime is resolved by explicit provisioning and a separate browser-launch gate. Browser infrastructure failure is now distinct from product assertion failure.

### Contract freeze status

C0 is frozen by ST-01 at schema version `1`, including the explicit runner and mode/reproducibility fixture. C1–C8 are executable version-1 scaffolds only. Their named provider tickets remain responsible for provider conformance and their later freeze points exactly as defined in the contract registry above.
'''
          path.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY

          if git diff --quiet -- development.md; then
            echo "development.md already contains ST-01 evidence"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development.md
          git commit -m "docs(stabilization): record ST-01 evidence [46-47/50] (#20)"
          git push origin HEAD:${GITHUB_REF_NAME}
